name: Repair ICT Daily Quiz Drive Crops

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-drive-crops.yml'
      - 'scripts/repair_drive_existing.py'

permissions:
  contents: read

concurrency:
  group: ict-daily-quiz-automation
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DRIVE_RAW_PARENT_ID: 1I9fU_ojRQBS-U3_5slnkWGN_SIsgRjmN
      DRIVE_CROP_PARENT_ID: 1mYROVvho24eDc3ys_OA2C2dmDq5cZ9NL
      REPAIR_FROM: '62'
      REPAIR_TO: '95'

    steps:
      - uses: actions/checkout@v4
      - name: Confirm Drive connection
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Configure GOOGLE_SERVICE_ACCOUNT_JSON to repair Drive images."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install processor and Drive client
        run: python -m pip install --disable-pip-version-check pymupdf pillow google-api-python-client google-auth
      - name: Generate all missing crop assets and validate answers
        run: |
          rm -f repairs/q14-marking-q02.part*.b64
          cat repairs/q14-clean/part* > repairs/q14-marking-q02.part0.b64
          python scripts/process_incoming_auto.py
      - name: Restore missing Drive PDFs and crops (Quiz 62-95)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/repair_drive_existing.py
