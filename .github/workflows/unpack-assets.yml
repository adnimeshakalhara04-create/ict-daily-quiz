name: Daily Quiz Manual Validator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and image dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Rebuild and validate all source PDFs
        run: |
          rm -f repairs/q14-marking-q02.part*.b64
          cat repairs/q14-clean/part* > repairs/q14-marking-q02.part0.b64
          python scripts/process_incoming_auto.py
      - name: Validate manifest and generated assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('quiz-data.json').read_text())
          count = data['quizCount']
          assert data['questionCount'] == count * 5
          assets = list(Path('daily_assets').rglob('*.webp'))
          assert len(assets) == count * 10, (len(assets), count * 10)
          print(f'Validated {count} quizzes / {len(assets)} WEBP assets')
          PY
