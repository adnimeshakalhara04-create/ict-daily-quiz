name: Daily Quiz PDF Pipeline

on:
  push:
    paths:
      - 'incoming/**'
      - 'scripts/process_incoming.py'
      - 'daily-quiz-cropped-images-under-25MB.zip'
      - '.github/workflows/unpack-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quiz-pipeline
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF and image dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Build and verify Daily Quiz assets
        run: python scripts/process_incoming.py

      - name: Verify generated manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('quiz-data.json').read_text())
          count = len(data['answers'])
          assert data['quizCount'] == count
          assert data['questionCount'] == count * 5
          assets = list(Path('daily_assets').rglob('*.webp'))
          assert len(assets) == count * 10, (len(assets), count * 10)
          print(f'Verified {count} quizzes / {len(assets)} WEBP assets')
          PY

      - name: Commit verified output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_assets quiz-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Daily Quiz assets"
            git push
          fi
